name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate site configuration JSON
        run: python3 -m json.tool docs.json >/dev/null
      - name: Run publisher unit tests
        run: python3 -m unittest discover -s tests -v
