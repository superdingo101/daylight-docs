name: Sync Released Product Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-released-docs.yml"
      - "scripts/publish_product_docs.py"
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-released-product-docs
  cancel-in-progress: false

jobs:
  sync-calendar-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publishing repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch latest released Calendar Card docs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$(gh api repos/superdingo101/daylight-calendar-card/releases/latest --jq '.tag_name')"
          echo "Publishing Calendar Card docs from $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          rm -rf .tmp/card-source
          mkdir -p .tmp

          git clone             --depth 1             --branch "$TAG"             https://github.com/superdingo101/daylight-calendar-card.git             .tmp/card-source

      - name: Build combined documentation
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          python3 scripts/publish_product_docs.py             --source-docs .tmp/card-source/docs             --product-key card             --product-label "Calendar Card"             --product-icon calendar-days             --release-tag "$RELEASE_TAG"             --publish-shared-assets

          rm -rf .tmp

      - name: Commit published documentation if it changed
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A --             .sync/card-release             card             docs.json             images             favicon.ico             style.css

          if git diff --cached --quiet; then
            echo "Published output already matches $RELEASE_TAG."
            exit 0
          fi

          git commit -m "Publish Calendar Card docs for $RELEASE_TAG"
          git push
